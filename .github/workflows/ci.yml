name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  checks: write
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Check C# formatting (CSharpier)
        run: dotnet csharpier check Assets/Scripts/ Assets/Tests/ server/

      - name: Check file sizes (100 MB limit)
        run: |
          errors=0
          while IFS= read -r file; do
            size=$(stat -c%s "$file" 2>/dev/null) || continue
            if [ "$size" -ge 104857600 ]; then
              size_mb=$((size / 1048576))
              echo "ERROR: $file is ${size_mb} MB (>= 100 MB). Use Git LFS or reduce file size."
              errors=1
            fi
          done < <(git ls-files)
          if [ $errors -ne 0 ]; then
            exit 1
          fi
          echo "No oversized files found."

      - name: Check meta file sync
        run: |
          errors=0
          while IFS= read -r file; do
            case "$file" in *.meta) continue ;; esac
            if ! git ls-files --error-unmatch "$file.meta" > /dev/null 2>&1; then
              echo "ERROR: $file tracked without its .meta file"
              errors=1
            fi
          done < <(git ls-files -- 'Assets/*')
          if [ $errors -ne 0 ]; then
            exit 1
          fi
          echo "All Asset files have matching .meta files."

  test-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Run server tests
        run: dotnet test server/ArrowThing.Server.Tests/ArrowThing.Server.Tests.csproj --logger "console;verbosity=normal"

  # Unity jobs only run on push to main here. PR runs (including same-repo PRs)
  # are handled by ci-unity.yml via pull_request_target, which has access to
  # secrets. Keeping the Unity jobs out of this file on `pull_request` events
  # avoids duplicate/skipped check entries on every PR.
  test:
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          customParameters: -nographics

  test-playmode:
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run PlayMode tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: PlayMode
          customParameters:
