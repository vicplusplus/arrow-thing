name: Deploy to Staging

# Staging auto-deploys on every push to main. Prod promotes the
# staging artifacts on a published GitHub release (see deploy.yml).
# The staging env is a soak gate for the Release Checklist before
# tagging. See docs/ReleaseChecklist.md.
#
# Path filters (see `changes` job below) skip the slow Unity build on
# server-only commits and the Docker build on client-only commits.
# IMPORTANT: the release commit must have both artifacts available for
# prod promotion. If the final pre-release commit touched only one
# side, dispatch this workflow manually at that commit before tagging
# to produce both artifacts.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  API_IMAGE: ghcr.io/vicplusplus/arrow-thing-api
  WORKER_IMAGE: ghcr.io/vicplusplus/arrow-thing-worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Skip the slow Unity build on server-only commits, and skip the
  # Docker build on client-only commits. Saves ~15 min on typical
  # server changes. workflow_dispatch always runs both (manual intent).
  # Paths list mirrors what each build actually consumes — keep this
  # accurate or you'll ship stale artifacts.
  changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            client:
              - 'Assets/**'
              - 'Packages/**'
              - 'ProjectSettings/**'
              - '.github/workflows/deploy-staging.yml'
            server:
              - 'server/**'
              - '.github/workflows/deploy-staging.yml'

  build-webgl:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache Unity Library
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: Library
          key: Library-WebGL-6000.3.8f1-${{ hashFiles('Assets/**', 'Packages/manifest.json') }}
          restore-keys: |
            Library-WebGL-6000.3.8f1-
            Library-WebGL-

      - name: Fetch tags
        run: git fetch origin --tags --force

      - name: Inject git commit hash
        run: |
          mkdir -p Assets/Resources
          git rev-parse --short HEAD > Assets/Resources/git-commit.txt

      - name: Set version (base tag + commit suffix)
        run: |
          # Plain "{BASE}+{SHORT}" with no env marker so the same build
          # can be promoted to prod unchanged (see deploy.yml). The
          # staging hostname already makes the env obvious to users;
          # Application.version doesn't need to encode it.
          BASE=$(git tag --sort=-v:refname | head -n1 | sed 's/^v//' || echo "0.0")
          SHORT=$(git rev-parse --short HEAD)
          VERSION="${BASE}+${SHORT}"
          echo "Setting bundleVersion to $VERSION"
          sed -i "s/bundleVersion: .*/bundleVersion: $VERSION/" ProjectSettings/ProjectSettings.asset

      - name: Build WebGL
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          allowDirtyBuild: true

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webgl-build-staging
          path: build/WebGL/WebGL
          # Prod promotes this artifact (see deploy.yml). 14d covers a
          # normal release cadence; tags older than that force a rebuild
          # via workflow_dispatch rebuild=true.
          retention-days: 14

  deploy-client:
    runs-on: ubuntu-latest
    needs: build-webgl
    if: ${{ !cancelled() && needs.build-webgl.result == 'success' }}
    environment: staging

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webgl-build-staging
          path: build

      # Bundle staging-only Pages Functions into the deploy directory.
      # The same WebGL artifact is promoted to prod by deploy.yml, so we must
      # not bake the proxy into the artifact itself — copying at deploy time
      # keeps the prod Pages project free of staging routing.
      - name: Checkout pages-staging sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: src
          sparse-checkout: pages-staging
          sparse-checkout-cone-mode: false

      - name: Bundle staging Pages Functions
        run: cp -r src/pages-staging/functions build/functions

      - name: Deploy to Cloudflare Pages (staging project)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=arrow-thing-staging --commit-dirty=true

  build-server:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:staging
            ${{ env.API_IMAGE }}:staging-${{ github.sha }}

      - name: Build and push Worker
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: server/Dockerfile.worker
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:staging
            ${{ env.WORKER_IMAGE }}:staging-${{ github.sha }}

  deploy-server:
    runs-on: ubuntu-latest
    needs: build-server
    if: ${{ !cancelled() && needs.build-server.result == 'success' }}
    environment: staging

    steps:
      - name: Deploy staging stack to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          # Staging shares nginx + observability with prod (see
          # server/deploy/docker-compose.yml). We only roll the staging
          # API + worker containers here — prod containers are untouched.
          # If the nginx.conf changed, the prod deploy workflow will
          # reload it on the next release; we deliberately do not reload
          # nginx from the staging workflow so a broken staging vhost
          # change cannot take prod down.
          ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.VPS_HOST }} '
            set -euo pipefail
            cd /home/deploy/arrow-thing/repo
            git fetch origin main
            git reset --hard origin/main
            ./server/deploy/setup.sh

            cd /home/deploy/arrow-thing

            # Staging services pin image tag :staging (prod uses :latest),
            # so a staging deploy can never pull a prod image or vice versa.
            docker compose --profile staging pull api-staging worker-staging

            # Roll DB/Redis first (no-op if already healthy), then API
            # (migrations), then worker.
            docker compose --profile staging up -d --no-deps db-staging redis-staging
            docker compose --profile staging up -d --no-deps --force-recreate api-staging

            echo "Waiting for staging API healthcheck..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect -f "{{.State.Health.Status}}" $(docker compose --profile staging ps -q api-staging) 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "Staging API healthy after ${i}x2s"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "Staging API did not become healthy within 60s"
                docker compose --profile staging logs --tail=200 api-staging
                exit 1
              fi
              sleep 2
            done

            docker compose --profile staging up -d --no-deps --force-recreate worker-staging
          '

      - name: Health check (staging)
        run: |
          echo "Waiting for staging API to be reachable..."
          sleep 10
          for i in $(seq 1 10); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://api-staging.arrow-thing.com/health)
            if [ "$STATUS" = "200" ]; then
              echo "Staging health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Staging health check failed after all retries"
          exit 1
