name: Deploy to Production

# Prod deploys on a published release. Reuses the staging artifacts
# (WebGL build + API/worker images) that were soaked during the
# pre-release checklist — no rebuild. This makes two guarantees:
#   1. prod ships the EXACT bits you tested on staging (bit-identical
#      WebGL bundle, bit-identical container digests), and
#   2. release turnaround drops from ~15 min (Unity build) to ~2 min
#      (deploy only).
#
# The release tag must point at a commit that has a successful
# `Deploy to Staging` run. Staging artifacts have 14d retention; if
# you tag a commit older than that, use `workflow_dispatch` with
# `rebuild=true` to force a fresh Unity build.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  API_IMAGE: ghcr.io/vicplusplus/arrow-thing-api
  WORKER_IMAGE: ghcr.io/vicplusplus/arrow-thing-worker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild WebGL + images from source (default: promote latest staging artifacts)"
        type: boolean
        default: false
      staging_run_id:
        description: "Staging run ID to promote (default: latest success on default branch)"
        type: string
        required: false

concurrency:
  group: prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read  # needed to download artifacts from the staging workflow run

jobs:
  validate-tag:
    # Reject non-semver tags before anything expensive. A tag like
    # release-2026-04-17 sneaks past scripts that parse it as a version.
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Check tag format
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "ERROR: release tag '$TAG' must match ^v[0-9]+\.[0-9]+(\.[0-9]+)?$"
            echo "Examples: v1.0, v1.0.0, v2.13.4"
            exit 1
          fi
          echo "Tag $TAG is valid."

      - name: Resolve tag SHA + version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          SHA=$(gh api repos/${{ github.repository }}/git/refs/tags/$TAG --jq '.object.sha')
          # Annotated tags — resolve to the commit SHA
          TYPE=$(gh api repos/${{ github.repository }}/git/refs/tags/$TAG --jq '.object.type')
          if [ "$TYPE" = "tag" ]; then
            SHA=$(gh api repos/${{ github.repository }}/git/tags/$SHA --jq '.object.sha')
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG -> $SHA"

  # ── Prepare: locate the staging artifacts to promote ──────────────────
  # On release: must be a run at the exact release commit SHA.
  # On workflow_dispatch (no rebuild): user-supplied run_id, or latest
  # successful staging run on the default branch.
  resolve-staging-run:
    needs: [validate-tag]
    if: ${{ !cancelled() && !inputs.rebuild && (needs.validate-tag.result == 'success' || needs.validate-tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      sha: ${{ steps.find.outputs.sha }}
      version: ${{ steps.find.outputs.version }}
    steps:
      - name: Find staging run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.staging_run_id }}" ]; then
            RUN_ID="${{ inputs.staging_run_id }}"
            echo "Using user-supplied staging run $RUN_ID"
          elif [ "${{ github.event_name }}" = "release" ]; then
            SHA="${{ needs.validate-tag.outputs.sha }}"
            echo "Looking for staging run at $SHA..."
            RUN_ID=$(gh run list \
              --repo ${{ github.repository }} \
              --workflow=deploy-staging.yml \
              --commit=$SHA \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [ -z "$RUN_ID" ]; then
              echo "ERROR: no successful Deploy to Staging run found at $SHA."
              echo "Staging must pass at the release commit before tagging."
              echo "To force a rebuild: re-run via workflow_dispatch with rebuild=true."
              exit 1
            fi
          else
            echo "Finding latest successful staging run on default branch..."
            RUN_ID=$(gh run list \
              --repo ${{ github.repository }} \
              --workflow=deploy-staging.yml \
              --branch=main \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [ -z "$RUN_ID" ]; then
              echo "ERROR: no successful staging runs found on main."
              exit 1
            fi
          fi

          # Resolve the commit SHA + version from the run itself
          RUN_SHA=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID --jq '.head_sha')
          BASE_TAG=$(git -c protocol.version=2 ls-remote --tags --sort=-v:refname https://github.com/${{ github.repository }}.git 'v*' | awk 'NR==1{sub("refs/tags/","",$2); print $2}' | sed 's/^v//' || echo "0.0")
          SHORT=$(echo "$RUN_SHA" | cut -c1-7)

          echo "run_id=$RUN_ID"       >> "$GITHUB_OUTPUT"
          echo "sha=$RUN_SHA"         >> "$GITHUB_OUTPUT"
          echo "version=${BASE_TAG}+${SHORT}" >> "$GITHUB_OUTPUT"
          echo "Resolved staging run $RUN_ID @ $RUN_SHA"

  # ── Client: promote staging WebGL artifact to prod Pages project ──────
  deploy-client:
    needs: [resolve-staging-run]
    if: ${{ !cancelled() && needs.resolve-staging-run.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download staging WebGL artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webgl-build-staging
          path: build
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-staging-run.outputs.run_id }}

      - name: Deploy to Cloudflare Pages (prod)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=arrow-thing --commit-dirty=true

  # ── Server: retag staging images to :latest + :<sha>, no rebuild ──────
  promote-server-images:
    needs: [resolve-staging-run]
    if: ${{ !cancelled() && needs.resolve-staging-run.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Retag staging images as prod (manifest-only, no pull)
        env:
          SHA: ${{ needs.resolve-staging-run.outputs.sha }}
        run: |
          # `imagetools create` copies the manifest to new tags without
          # pulling the layers — prod ships the exact digest that soaked.
          for IMAGE in "$API_IMAGE" "$WORKER_IMAGE"; do
            SRC="$IMAGE:staging-$SHA"
            echo "Promoting $SRC -> $IMAGE:latest + $IMAGE:$SHA"
            docker buildx imagetools create \
              --tag "$IMAGE:latest" \
              --tag "$IMAGE:$SHA" \
              "$SRC"
          done

  # ── Fallback path: rebuild everything from source (workflow_dispatch) ─
  rebuild-webgl:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild }}
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache Unity Library
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: Library
          key: Library-WebGL-6000.3.8f1-${{ hashFiles('Assets/**', 'Packages/manifest.json') }}
          restore-keys: |
            Library-WebGL-6000.3.8f1-
            Library-WebGL-

      - name: Fetch tags
        run: git fetch origin --tags --force

      - name: Inject git commit hash
        run: |
          mkdir -p Assets/Resources
          git rev-parse --short HEAD > Assets/Resources/git-commit.txt

      - name: Set version
        run: |
          BASE=$(git tag --sort=-v:refname | head -n1 | sed 's/^v//' || echo "0.0")
          SHORT=$(git rev-parse --short HEAD)
          VERSION="${BASE}+${SHORT}"
          sed -i "s/bundleVersion: .*/bundleVersion: $VERSION/" ProjectSettings/ProjectSettings.asset

      - name: Build WebGL
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          allowDirtyBuild: true

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webgl-build-prod-rebuild
          path: build/WebGL/WebGL
          retention-days: 1

  rebuild-server:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Build and push Worker
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: server/Dockerfile.worker
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:latest
            ${{ env.WORKER_IMAGE }}:${{ github.sha }}

  deploy-client-rebuild:
    needs: rebuild-webgl
    if: ${{ !cancelled() && needs.rebuild-webgl.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webgl-build-prod-rebuild
          path: build

      - name: Deploy to Cloudflare Pages (prod)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=arrow-thing --commit-dirty=true

  # ── Server deploy: canary API first, then worker ──────────────────────
  deploy-server:
    needs: [promote-server-images, rebuild-server]
    # Run if either the promote path OR the rebuild path succeeded. Both
    # produce the same :latest tag; deploy is identical downstream.
    if: >-
      ${{ !cancelled() && (
        needs.promote-server-images.result == 'success' ||
        needs.rebuild-server.result == 'success'
      ) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to VPS (canary API first, then worker)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          # Canary ordering: API rolls first (migrations run there). Wait for
          # its healthcheck to clear before touching the worker, so a bad
          # migration fails fast without also restarting the worker fleet.
          # Docker's `unless-stopped` policy keeps the previous image alive
          # if the new one can't come up.
          ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.VPS_HOST }} '
            set -euo pipefail
            cd /home/deploy/arrow-thing/repo
            git fetch origin main
            git reset --hard origin/main
            ./server/deploy/setup.sh

            cd /home/deploy/arrow-thing
            docker compose pull

            # 1) Roll API (migrations, cookie/cors changes, anything schema-y).
            docker compose up -d --no-deps api

            # 2) Wait for API /health to come up. Compose healthchecks take up
            #    to 30s start_period + retries, plus migration time.
            echo "Waiting for API healthcheck..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect -f "{{.State.Health.Status}}" $(docker compose ps -q api) 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "API healthy after ${i}x2s"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "API did not become healthy within 60s"
                docker compose logs --tail=200 api
                exit 1
              fi
              sleep 2
            done

            # 3) Roll worker (schema is now validated by the healthy API).
            docker compose up -d --no-deps worker

            # 4) Bring up anything else that was added/updated + nginx reload.
            docker compose up -d --remove-orphans
            docker compose restart nginx
          '

      - name: Health check
        run: |
          echo "Waiting for container to be ready..."
          sleep 10
          for i in $(seq 1 10); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://api.arrow-thing.com/health)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after all retries"
          exit 1

      - name: Smoke tests
        run: |
          API="https://api.arrow-thing.com"
          FAILURES=0

          smoke() {
            local METHOD=$1 ENDPOINT=$2 EXPECTED=$3 BODY=$4
            if [ -n "$BODY" ]; then
              RESP=$(curl -s -o /tmp/smoke_body -w "%{http_code}" -X "$METHOD" "$API$ENDPOINT" \
                -H "Content-Type: application/json" -d "$BODY")
            else
              RESP=$(curl -s -o /tmp/smoke_body -w "%{http_code}" -X "$METHOD" "$API$ENDPOINT")
            fi
            if [ "$RESP" = "$EXPECTED" ]; then
              echo "PASS: $METHOD $ENDPOINT → $RESP"
            else
              echo "FAIL: $METHOD $ENDPOINT → $RESP (expected $EXPECTED)"
              cat /tmp/smoke_body
              echo
              FAILURES=$((FAILURES + 1))
            fi
          }

          # Unauthenticated endpoints return expected status codes
          smoke GET  /api/auth/me       401
          smoke POST /api/auth/login    401  '{"email":"smoke-nonexistent@test.invalid","password":"smoke12345678"}'
          smoke POST /api/auth/forgot-password 200 '{"email":"smoke-nonexistent@test.invalid"}'

          # Registration validation rejects bad input
          smoke POST /api/auth/register 400 '{"email":"not-an-email","password":"short","displayName":""}'

          # Admin endpoints reject missing key
          smoke POST /api/admin/lock-account   401 '{"email":"anyone@test.invalid"}'
          smoke POST /api/admin/unlock-account 401 '{"email":"anyone@test.invalid"}'

          if [ "$FAILURES" -gt 0 ]; then
            echo "Smoke tests failed: $FAILURES failure(s)"
            exit 1
          fi
          echo "All smoke tests passed"
