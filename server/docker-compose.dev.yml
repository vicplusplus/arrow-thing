services:
  db:
    image: postgres:16-alpine
    container_name: arrowthing-dev
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - arrowthing-dev-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: arrowthing-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  arrowthing-dev-data:
  redis-dev-data:
