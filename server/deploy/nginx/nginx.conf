worker_processes auto;

events {
    worker_connections 512;
}

http {
    server_tokens off;

    # Rate limiting zones — keyed on real client IP from Cloudflare
    limit_req_zone $http_cf_connecting_ip zone=auth:10m rate=5r/m;
    limit_req_zone $http_cf_connecting_ip zone=api:10m rate=30r/m;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name api.arrow-thing.com;
        return 301 https://$host$request_uri;
    }

    # HTTPS — Cloudflare Origin cert + Authenticated Origin Pulls
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.arrow-thing.com;

        ssl_certificate     /etc/nginx/certs/origin.pem;
        ssl_certificate_key /etc/nginx/certs/origin-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Authenticated Origin Pulls — only Cloudflare can connect
        ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull.pem;
        ssl_verify_client on;

        client_max_body_size 10m;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # CORS is owned by ASP.NET (Cors__AllowedOrigins__0). Nginx must not
        # emit Access-Control-* headers or the browser sees duplicates.

        # Auth endpoints — strict rate limit
        location ~ ^/api/auth/(register|login|verify-code|forgot-password|reset-password|resend-verification)$ {
            limit_req zone=auth burst=3 nodelay;

            proxy_pass http://api:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # All other API routes
        location /api/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://api:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Co-op WebSocket — query string contains JWT, do not log
        location /ws/coop/ {
            limit_req zone=api burst=10 nodelay;
            access_log off;

            proxy_pass http://api:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long-lived WebSocket connections
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Health check (no rate limit)
        location = /health {
            proxy_pass http://api:5000;
            proxy_set_header Host $host;
        }

        # Deny everything else
        location / {
            return 404;
        }
    }
}
