worker_processes auto;

events {
    worker_connections 512;
}

http {
    server_tokens off;

    # Rate limiting zones — keyed on real client IP from Cloudflare.
    # Earlier 5r/m was too aggressive: the browser fires a CORS preflight
    # OPTIONS before every POST, so legit fat-finger retries burned the
    # budget in seconds and nginx returned 503 (with no CORS headers, so
    # the browser surfaced it as a generic "unknown error"). Bumped to
    # 15r/m burst=10 and preflights are excluded below via $limit_key.
    limit_req_zone $limit_key zone=auth:10m rate=15r/m;
    limit_req_zone $limit_key zone=api:10m rate=30r/m;

    # Treat an empty key as an unlimited request. Set it to empty for
    # CORS preflights (OPTIONS) and for traffic missing CF-Connecting-IP
    # so we never throttle preflights or unidentified internal probes.
    map $request_method $is_options {
        default 0;
        OPTIONS 1;
    }
    map "$is_options:$http_cf_connecting_ip" $limit_key {
        ~^0:.+$     $http_cf_connecting_ip;
        default     "";
    }

    # Per-environment upstream + CORS origin, keyed on the request's Host.
    # Prod and staging share one set of server blocks; $host picks the
    # right backend container and the right ACAO header.
    map $host $upstream_api {
        api.arrow-thing.com          api:5000;
        staging.api.arrow-thing.com  api-staging:5000;
    }
    map $host $cors_origin {
        api.arrow-thing.com          https://arrow-thing.com;
        staging.api.arrow-thing.com  https://staging.arrow-thing.com;
        default                      "";
    }

    # Return 429 Too Many Requests instead of the default 503 Service
    # Unavailable so clients can distinguish "you're being rate-limited"
    # from a real backend outage.
    limit_req_status 429;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;

    # Redirect HTTP to HTTPS (both environments share this block).
    server {
        listen 80;
        listen [::]:80;
        server_name api.arrow-thing.com staging.api.arrow-thing.com;
        return 301 https://$host$request_uri;
    }

    # HTTPS — Cloudflare Origin cert + Authenticated Origin Pulls.
    # Serves both api.arrow-thing.com and staging.api.arrow-thing.com.
    # The origin cert MUST cover both names (wildcard *.arrow-thing.com
    # or a SAN cert listing both). See docs/ReleaseChecklist.md for
    # provisioning steps.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.arrow-thing.com staging.api.arrow-thing.com;

        ssl_certificate     /etc/nginx/certs/origin.pem;
        ssl_certificate_key /etc/nginx/certs/origin-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Authenticated Origin Pulls — only Cloudflare can connect
        ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull.pem;
        ssl_verify_client on;

        # Docker's embedded DNS — required because proxy_pass uses a
        # variable ($upstream_api) which forces runtime name resolution
        # rather than startup-time resolution.
        resolver 127.0.0.11 valid=10s ipv6=off;

        client_max_body_size 10m;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # CORS is owned by ASP.NET (Cors__AllowedOrigins__0) on the happy
        # path: nginx must not emit Access-Control-* headers for proxied
        # responses or the browser sees duplicates.
        #
        # BUT — when nginx short-circuits (rate limit, client cert reject)
        # ASP.NET never sees the request and no ACAO header is emitted, so
        # the browser hides the 429 behind a generic CORS failure ("unknown
        # error" on the client). Route the 429 response through a named
        # location that adds CORS headers + structured JSON so the client
        # can surface the real reason. $cors_origin is per-environment.
        error_page 429 @ratelimited;
        location @ratelimited {
            default_type application/json;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Vary "Origin" always;
            return 429 '{"error":"Too many requests. Please slow down."}';
        }

        # Auth endpoints — strict rate limit
        location ~ ^/api/auth/(register|login|verify-code|forgot-password|reset-password|resend-verification)$ {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://$upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # All other API routes
        location /api/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://$upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Co-op WebSocket — query string contains JWT, do not log
        location /ws/coop/ {
            limit_req zone=api burst=10 nodelay;
            access_log off;

            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long-lived WebSocket connections
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Health check (no rate limit)
        location = /health {
            proxy_pass http://$upstream_api;
            proxy_set_header Host $host;
        }

        # Deny everything else
        location / {
            return 404;
        }
    }
}
